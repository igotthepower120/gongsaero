<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>조건 및 정보입력 개선 UI</title>
  <style>
    :root {
      --primary: #0f172a;
      --primary-blue: #1d4ed8;
      --bg-gray: #f8fafc;
      --border: #cbd5e1;
      --border-focus: #3b82f6;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --accent-red: #ef4444;
      --badge-bg: #eff6ff;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f1f5f9;
      color: var(--text-main);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .form-container {
      background: #ffffff;
      width: 100%;
      max-width: 800px;
      padding: 36px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    .form-header {
      margin-bottom: 32px;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 16px;
    }

    .form-header h2 {
      font-size: 1.35rem;
      margin: 0 0 6px 0;
    }

    .form-header p {
      margin: 0;
      font-size: 0.875rem;
      color: var(--text-sub);
    }

    .form-row {
      display: grid;
      grid-template-columns: 140px 1fr;
      align-items: start;
      gap: 16px;
      margin-bottom: 24px;
    }

    .form-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
      padding-top: 10px;
    }

    .form-label .required {
      color: var(--accent-red);
      margin-left: 2px;
    }

    /* 공통 Input & Select */
    input[type="text"], input[type="date"], select {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus, select:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    /* 개선된 기한 입력 스타일 */
    .datetime-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .datetime-inputs {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .datetime-inputs input[type="date"] {
      flex: 2;
    }

    .datetime-inputs select {
      flex: 1.2;
    }

    /* Quick Choice Buttons (빠른 선택) */
    .quick-chips {
      display: flex;
      gap: 6px;
    }

    .chip-btn {
      background-color: var(--bg-gray);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 0.775rem;
      color: #475569;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .chip-btn:hover {
      background-color: var(--badge-bg);
      border-color: var(--border-focus);
      color: var(--primary-blue);
    }

    .guide-text {
      font-size: 0.8rem;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
    }

    .guide-text.highlight {
      color: var(--primary-blue);
      font-weight: 500;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 36px;
      padding-top: 20px;
      border-top: 1px solid #f1f5f9;
    }

    .btn {
      height: 44px;
      padding: 0 32px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid var(--border);
    }

    .btn-secondary {
      background: #ffffff;
      color: var(--text-main);
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      border: none;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <div class="form-header">
      <h2>조건 및 정보입력</h2>
      <p>규격 및 제조사와 수량(단위)에 유의하여 작성해 주시기 바랍니다.</p>
    </div>

    <!-- 기존 필드 예시 (마감 방식) -->
    <div class="form-row">
      <div class="form-label">마감 방식</div>
      <div>
        <select>
          <option>일반 입찰</option>
        </select>
      </div>
    </div>

    <!-- 개선된 UI 1: 투찰기한 -->
    <div class="form-row">
      <div class="form-label">투찰기한 <span class="required">*</span></div>
      <div class="datetime-group">
        <div class="datetime-inputs">
          <input type="date" id="bid-date" value="2026-10-19">
          <select id="bid-time">
            <option value="09:00">09:00 (오전)</option>
            <option value="12:00">12:00 (정오)</option>
            <option value="15:00" selected>15:00 (업무마감 전)</option>
            <option value="18:00">18:00 (퇴근시각)</option>
          </select>
        </div>
        <!-- 빠른 날짜 선택 옵션 -->
        <div class="quick-chips">
          <button type="button" class="chip-btn" onclick="setQuickBid(6)">+6시간(최소)</button>
          <button type="button" class="chip-btn" onclick="setQuickBid(24)">내일 마감</button>
          <button type="button" class="chip-btn" onclick="setQuickBid(72)">3일 뒤 마감</button>
        </div>
        <div class="guide-text highlight">
          ⓘ 업무시간 기준 최소 6시간 이후부터 선택이 가능합니다. (가능 시각: 오늘 15:00 이후)
        </div>
      </div>
    </div>

    <!-- 개선된 UI 2: 납품기한 -->
    <div class="form-row">
      <div class="form-label">납품기한 <span class="required">*</span></div>
      <div class="datetime-group">
        <div class="datetime-inputs">
          <input type="date" id="delivery-date" value="2026-10-20">
          <select id="delivery-time">
            <option value="09:00">09:00 (오전)</option>
            <option value="12:00">12:00 (점심 전)</option>
            <option value="18:00" selected>18:00 (당일 마감)</option>
          </select>
        </div>
        <!-- 빠른 날짜 선택 옵션 -->
        <div class="quick-chips">
          <button type="button" class="chip-btn">투찰 마감 +6시간</button>
          <button type="button" class="chip-btn">투찰 마감 +1일</button>
          <button type="button" class="chip-btn">투찰 마감 +3일</button>
        </div>
        <div class="guide-text">
          ⓘ 투찰마감시간으로부터 업무시간 기준 6시간 이후부터 선택 가능합니다.
        </div>
      </div>
    </div>

    <!-- 기존 필드 예시 (배송방법) -->
    <div class="form-row">
      <div class="form-label">배송방법</div>
      <div>
        <select>
          <option>무관(직접배송 혹은 택배)</option>
        </select>
      </div>
    </div>

    <!-- 하단 버튼 -->
    <div class="btn-group">
      <button class="btn btn-secondary">이전</button>
      <button class="btn btn-primary">다음</button>
    </div>
  </div>

  <script>
    // 예시: 빠른 시간 선택 버튼 동작
    function setQuickBid(hours) {
      const dateInput = document.getElementById('bid-date');
      const timeSelect = document.getElementById('bid-time');
      
      const now = new Date();
      now.setHours(now.getHours() + hours);
      
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      
      dateInput.value = `${yyyy}-${mm}-${dd}`;
    }
  </script>
</body>
</html>
